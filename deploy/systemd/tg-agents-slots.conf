#Type Path                              Mode UID  GID  Age Argument
# Потолок параллелизма C=16 (predictable-agent-scheduling, tg-agent@.service):
# каталог + файлы-слоты для flock-семафора. /run — tmpfs, не переживает
# перезагрузку; это правило пересоздаёт их декларативно при каждой загрузке,
# до первого срабатывания любого tg-agent@*.timer. Устанавливается в
# /etc/tmpfiles.d/ (не /etc/systemd/system/, где лежат сами юниты — см.
# docs/operation.md).
d /run/tg-agents 0755 root root -
f /run/tg-agents/slot-0.lock 0644 root root -
f /run/tg-agents/slot-1.lock 0644 root root -
f /run/tg-agents/slot-2.lock 0644 root root -
f /run/tg-agents/slot-3.lock 0644 root root -
